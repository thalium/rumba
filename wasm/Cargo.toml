[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
mbalib = { path = "../mbalib" }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"


[profile.dev]
panic = "unwind"

[lib]
name = "wasm"
crate-type = ["cdylib"]
