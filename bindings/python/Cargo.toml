[package]
name = "pyrumba"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the rumba MBA simplification library"

[dependencies]
# `abi3-py39` builds against the stable ABI: one wheel per platform covers
# CPython 3.9+ instead of one wheel per interpreter version.
pyo3 = { version = "0.26.0", features = ["extension-module", "abi3-py39"] }
rumba-core = { workspace = true }

[lib]
name = "pyrumba"
crate-type = ["cdylib"]

[features]
jit = ["rumba-core/jit"]
parse = ["rumba-core/parse"]
