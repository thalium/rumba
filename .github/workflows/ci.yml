name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Strict on the crates we publish to crates.io.
      - name: clippy (core + cli)
        run: cargo clippy -p rumba-core -p rumba --all-features --all-targets -- -D warnings
      # Bindings are now warning-clean too, so gate them strictly.
      - name: clippy (bindings)
        run: cargo clippy -p c -p pyrumba -p wasm --all-features --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p rumba-core -p rumba --all-features --verbose
      - name: Test
        run: cargo test -p rumba-core -p rumba --all-features --verbose
      - name: Test C bindings
        run: cargo test -p c --all-features --verbose

  c-bindings:
    name: c bindings (header + link)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen
      # The header is committed; fail if it has drifted from the Rust source.
      - name: Verify the generated header is up to date
        working-directory: bindings/c
        run: |
          cbindgen --config cbindgen.toml --output /tmp/rumba.h
          diff include/rumba.h /tmp/rumba.h
      # Compile a C program against the header and link the cdylib, catching
      # ABI/linkage problems the in-crate Rust tests cannot see.
      - name: Build the cdylib
        run: cargo build -p c --all-features
      - name: Compile, link and run the C smoke test
        run: |
          cc bindings/c/csrc/smoke.c -Ibindings/c/include -DDEFINE_RUMBA_PARSE \
            -Ltarget/debug -lrumbac -o /tmp/smoke
          LD_LIBRARY_PATH=target/debug /tmp/smoke

  python:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install maturin and pytest
        run: pip install maturin pytest
      - name: Build the pyrumba wheel
        run: maturin build -m bindings/python/Cargo.toml --features parse --out dist
      - name: Install the wheel
        run: pip install pyrumba --no-index --find-links dist
      - name: Run pytest
        run: pytest bindings/python/tests --verbose

  docs:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps -p rumba-core -p rumba --all-features

  wasm:
    name: wasm build + test
    runs-on: ubuntu-latest
    # wasm-bindgen tests exercise the RNG at runtime, so pin getrandom's wasm
    # backend on top of the workspace-wide `-D warnings`.
    env:
      RUSTFLAGS: '-D warnings --cfg getrandom_backend="wasm_js"'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build
        run: cargo build -p wasm --target wasm32-unknown-unknown
      - name: Test (node)
        working-directory: bindings/wasm
        run: wasm-pack test --node -- --features parse
