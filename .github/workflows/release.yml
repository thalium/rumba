name: Release

# Publishes to crates.io when a version tag is pushed, e.g. `v1.0.0`.
# Requires a `CARGO_REGISTRY_TOKEN` repository secret (crates.io API token).
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches workspace version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VER=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="rumba-core"))')
          echo "tag=$TAG crate=$CRATE_VER"
          test "$TAG" = "$CRATE_VER" || { echo "::error::tag v$TAG != rumba-core $CRATE_VER"; exit 1; }

      # Publish the core first; the CLI depends on it. `cargo publish` waits for
      # the crate to be available on the index before returning.
      - name: Publish rumba-core
        run: cargo publish -p rumba-core --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rumba (cli)
        run: cargo publish -p rumba
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
